<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 150" role="img" aria-label="Apex Packaging &amp; Converting">
  <title>Apex Packaging &amp; Converting</title>
  <defs>
    <!-- Dynamic Gradient for Apex Summit Facet -->
    <linearGradient id="apexCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A35" />
      <stop offset="100%" stop-color="#B80014" />
    </linearGradient>
    <linearGradient id="apexSlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#070B12" />
    </linearGradient>
  </defs>

  <!-- ==================== 1. GEOMETRIC APEX EMBLEM ==================== -->
  <g transform="translate(15, 10)">
    <!-- CMYK Process Alignment Calibration Bar -->
    <g transform="translate(0, 18)">
      <circle cx="8" cy="8" r="4.5" fill="#00A3E0" />
      <circle cx="8" cy="26" r="4.5" fill="#E6007E" />
      <circle cx="8" cy="44" r="4.5" fill="#FFD100" />
      <circle cx="8" cy="62" r="4.5" fill="#0F172A" />
      <line x1="8" y1="72" x2="8" y2="102" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2 2" />
    </g>

    <!-- Main Geometric 'A' Peak / Folded Packaging Chevron -->
    <!-- Left Ascender / Facet -->
    <polygon points="75,12 30,118 52,118 75,56" fill="url(#apexCrimsonGrad)" />
    
    <!-- Right Ascender / Facet -->
    <polygon points="75,12 120,118 98,118 75,56" fill="#E00019" />

    <!-- Interlocking Precision Crossbar / Converting Fold Plane -->
    <polygon points="46,82 104,82 112,100 38,100" fill="url(#apexSlateGrad)" />

    <!-- Sharp Center Apex Registration Diamond -->
    <polygon points="75,28 85,46 75,64 65,46" fill="#FAFAFC" />
    <circle cx="75" cy="46" r="3.5" fill="#E00019" />

    <!-- Precision Registration Crosshair Markers -->
    <circle cx="75" cy="118" r="3" fill="none" stroke="#E00019" stroke-width="1.5" />
    <line x1="75" y1="112" x2="75" y2="124" stroke="#E00019" stroke-width="1.5" />
    <line x1="69" y1="118" x2="81" y2="118" stroke="#E00019" stroke-width="1.5" />
  </g>

  <!-- ==================== 2. BRAND TYPOGRAPHY ==================== -->
  <!-- Primary Wordmark: APEX -->
  <text x="160" y="78" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', 'Helvetica Neue', sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#0F172A">APEX</text>

  <!-- Secondary Industrial Wordmark: PACKAGING & CONVERTING -->
  <g transform="translate(162, 94)">
    <!-- High-Legibility Background Badge Pill -->
    <rect x="0" y="0" width="375" height="28" rx="6" fill="#0F172A" />
    <text x="187" y="19" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', 'IBM Plex Mono', sans-serif" 
          font-size="13" 
          font-weight="800" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="#FFFFFF">PACKAGING &amp; CONVERTING</text>
  </g>

  <!-- Subtitle Tagline / Specification -->
  <text x="164" y="136" 
        font-family="'IBM Plex Mono', monospace" 
        font-size="9.5" 
        font-weight="700" 
        letter-spacing="2" 
        fill="#64748B">PRECISION CONVERTING • FINAT STANDARD</text>

  <!-- CMYK Process Registration Line -->
  <g transform="translate(485, 131)">
    <rect x="0" y="0" width="12" height="4" fill="#00A3E0" />
    <rect x="13" y="0" width="12" height="4" fill="#E6007E" />
    <rect x="26" y="0" width="12" height="4" fill="#FFD100" />
    <rect x="39" y="0" width="12" height="4" fill="#0F172A" />
  </g>
</svg>